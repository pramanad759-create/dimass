<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Profil Porprov Kaltim</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #000;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; color: #fff;
  }
  
  .phone-screen {
    width: 100%; max-width: 400px; min-height: 100vh;
    background: linear-gradient(180deg, #1f2c4e 0%, #0d1224 40%, #080b14 100%);
    padding: 40px 20px; position: relative;
  }

  /* --- HEADER --- */
  .header {
    text-align: center; margin-bottom: 30px; position: relative;
  }
  .logo-box {
    width: 70px; height: 70px; background: #fff; border-radius: 12px;
    margin: 0 auto 15px; display: grid; place-items: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5); overflow: hidden;
  }
  .logo-box img { width: 100%; height: 100%; object-fit: contain; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; margin-bottom: 6px; }
  .header a { color: #64b5f6; font-size: 12px; text-decoration: none; }

  /* --- KARTU UTAMA --- */
  .profile-card {
    background: #171c2e;
    border-radius: 16px;
    border: 1px solid #3a4a6b;
    position: relative;
    margin-bottom: 16px;
    overflow: hidden;
  }
  /* Lengkungan atas (gradasi biru) */
  .profile-card-top {
    background: linear-gradient(135deg, #2980b9, #1a5276);
    height: 90px; width: 100%;
    position: relative;
    border-bottom-left-radius: 50% 20px;
    border-bottom-right-radius: 50% 20px;
  }
  /* Aksesoris garis melayang di pinggir */
  .profile-card::before, .profile-card::after {
    content: ""; position: absolute; top: 80px; width: 6px; height: 20px;
    background: #1f2c4e; border-radius: 10px; z-index: 10;
  }
  .profile-card::before { left: -3px; }
  .profile-card::after { right: -3px; }

  .profile-pic-container {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 110px; border-radius: 50%; border: 4px solid #171c2e;
    background: #fff; z-index: 5;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
  }
  .profile-pic-container img {
    width: 100%; height: 100%; object-fit: cover;
  }

  .profile-info {
    padding: 65px 20px 20px; text-align: center;
  }
  .profile-info h2 {
    font-size: 20px; font-weight: 800; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 12px;
  }
  .tags {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  }
  .tag {
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
  }
  .tag-blue { background: #2980b9; color: #fff; }
  .tag-dark { background: #23293d; color: #fff; border: 1px solid #3a4a6b; }
  .tag-green { background: #1abc9c; color: #fff; }

  /* --- KOTAK IDENTITAS --- */
  .info-box {
    background: #121726; border-radius: 16px; padding: 20px;
    border: 1px solid #2a344a; margin-bottom: 16px;
  }
  .info-box h3 {
    color: #64b5f6; font-size: 14px; font-weight: 600; letter-spacing: 1px; margin-bottom: 20px;
  }
  .info-row { margin-bottom: 16px; }
  .info-row:last-child { margin-bottom: 0; }
  .info-label { font-size: 11px; color: #8c9bb3; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
  .info-value { font-size: 16px; font-weight: 600; }

</style>
</head>
<body>

<div class="phone-screen">

  <!-- Header -->
  <div class="header">
    <div class="logo-box">
      <!-- Placeholder logo, ganti src-nya pakai logo asli kalau ada -->
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f4/National_Emblem_of_Indonesia_Garuda_Pancasila.svg/800px-National_Emblem_of_Indonesia_Garuda_Pancasila.svg.png" alt="Logo">
    </div>
    <h1>PORPROV KALTIM</h1>
    <a href="#">Kembali ke halaman verifikasi</a>
  </div>

  <!-- Kartu Profil -->
  <div class="profile-card">
    <div class="profile-card-top"></div>
    
    <div class="profile-pic-container">
      <!-- GANTI LINK DI BAWAH PAKAI FOTO MUKA LO -->
      <!-- Kalau mau pake foto dari HP, ubah src jadi nama file fotonya, misal: src="foto-dimas.jpg" -->
      <img src="https://i.ibb.co/3s6j7v1/placeholder-face.jpg" alt="Foto Profil" id="fotoProfil">
    </div>

    <div class="profile-info">
      <h2>DIMAS LISKA PRAMANA</h2>
      <div class="tags">
        <span class="tag tag-blue">Kota Bontang</span>
        <span class="tag tag-dark">Judo</span>
        <span class="tag tag-green">LOLOS VERIFIKASI</span>
      </div>
    </div>
  </div>

  <!-- Identitas Publik -->
  <div class="info-box">
    <h3>IDENTITAS PUBLIK</h3>
    
    <div class="info-row">
      <div class="info-label">Nama Lengkap</div>
      <div class="info-value">DIMAS LISKA PRAMANA</div>
    </div>

    <div class="info-row">
      <div class="info-label">Nama Panggilan</div>
      <div class="info-value">-</div>
    </div>

    <div class="info-row">
      <div class="info-label">Jenis Kelamin</div>
      <div class="info-value">Laki-Laki</div>
    </div>
  </div>

  <!-- Keolahragaan -->
  <div class="info-box">
    <h3>KEOLAHRAGAAN</h3>
  </div>

</div>

<script>
  // Script buat ganti foto otomatis kalau lo mau ngedit lewat browser
  // Tapi cara paling gampang: langsung ganti link src di atas.
</script>

</body>
</html>
